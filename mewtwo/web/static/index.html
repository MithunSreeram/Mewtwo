<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mewtwo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🧬</span>
      <span class="brand-name">Mewtwo</span>
      <span class="brand-sub">bug bounty dashboard · localhost</span>
    </div>
    <div class="top-right">
      <label class="ws-pick" for="ws-select">
        workspace
        <select id="ws-select" aria-label="Active workspace"></select>
      </label>
      <button class="btn-mini" id="btn-new-ws" title="Create a new workspace" aria-label="Create a new workspace">+ New</button>
      <span id="badge-ai" class="badge" title="AI features configured">AI</span>
      <span id="badge-auth" class="badge" title="Authenticated scanning configured">auth</span>
      <span id="conn" class="conn-dot" title="live connection" role="status" aria-label="live connection status">●</span>
    </div>
  </header>

  <main class="layout">
    <section class="content">
      <!-- stat cards -->
      <div class="stats" id="stats"></div>

      <!-- target line -->
      <div class="target-line" id="target-line"></div>

      <!-- tabs -->
      <nav class="tabs" id="tabs">
        <button data-tab="overview" class="tab active">Overview</button>
        <button data-tab="subdomains" class="tab">Subdomains</button>
        <button data-tab="urls" class="tab">URLs</button>
        <button data-tab="vectors" class="tab">Attack Surface</button>
        <button data-tab="findings" class="tab">Findings</button>
        <button data-tab="scope" class="tab">Scope</button>
      </nav>

      <div class="panel" id="panel"></div>
    </section>

    <aside class="sidebar">
      <div class="controls">
        <h3>Run</h3>
        <div class="job-status" id="job-status">idle</div>

        <div class="ctl-group">
          <button class="btn" id="btn-recon">Recon</button>
          <label class="chk"><input type="checkbox" id="recon-passive"> passive only</label>
          <label class="chk"><input type="checkbox" id="recon-force"> force (ignore checkpoints)</label>
        </div>

        <div class="ctl-group">
          <button class="btn" id="btn-surface">Map surface</button>
        </div>

        <div class="ctl-group">
          <button class="btn btn-accent" id="btn-hunt">Hunt</button>
          <label class="sel">tier
            <select id="hunt-tier">
              <option value="safe">safe</option>
              <option value="normal" selected>normal</option>
              <option value="aggressive">aggressive</option>
            </select>
          </label>
          <label class="sel">rate/s
            <input type="number" id="hunt-rate" min="0" value="0" step="1">
          </label>
          <label class="chk"><input type="checkbox" id="hunt-scope" checked> enforce scope</label>
          <label class="chk"><input type="checkbox" id="hunt-auth"> use auth (from env)</label>
        </div>
      </div>

      <div class="log-wrap">
        <div class="log-head">
          <h3>Live activity</h3>
          <button class="btn-mini" id="log-clear">clear</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </aside>
  </main>

  <!-- finding detail drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Finding</h2>
      <button class="btn-mini" id="drawer-close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <!-- new workspace modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <div class="modal" id="ws-modal" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title" hidden>
    <div class="modal-head">
      <h2 id="ws-modal-title">New workspace</h2>
      <button class="btn-mini" id="ws-modal-close" aria-label="Close dialog">✕</button>
    </div>
    <form class="modal-body" id="ws-form">
      <label class="field">
        <span>Name <em>*</em></span>
        <input type="text" id="ws-name" required autocomplete="off" placeholder="Acme Corp" aria-required="true">
      </label>
      <label class="field">
        <span>Root domain</span>
        <input type="text" id="ws-domain" autocomplete="off" placeholder="acme.com">
      </label>
      <label class="field">
        <span>Platform</span>
        <select id="ws-platform">
          <option value="">—</option>
          <option value="hackerone">HackerOne</option>
          <option value="bugcrowd">Bugcrowd</option>
          <option value="private">Private</option>
        </select>
      </label>
      <label class="field">
        <span>Program URL</span>
        <input type="text" id="ws-program" autocomplete="off" placeholder="https://hackerone.com/acme">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" id="ws-cancel">Cancel</button>
        <button type="submit" class="btn btn-accent">Create</button>
      </div>
      <p class="hint">Tip: after creating, add in-scope patterns in the <b>Scope</b> tab before hunting.</p>
    </form>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
